<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRE Reliability Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --red: #f85149; --red-dim: rgba(248,81,73,.12);
    --green: #3fb950; --orange: #d29922; --blue: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
           border-bottom: 1px solid var(--border); padding-bottom: 14px; }
  header h1 { font-size: 20px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  .pill { font-weight: 700; font-size: 12px; letter-spacing: .04em;
          padding: 4px 10px; border-radius: 999px; border: 1px solid; }
  .pill.critical { color: var(--red); border-color: var(--red); background: var(--red-dim); }
  .pill.warning  { color: var(--orange); border-color: var(--orange); }
  .pill.ok       { color: var(--green); border-color: var(--green); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
          gap: 14px; margin-top: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border);
          border-radius: 8px; padding: 14px 16px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .big { font-size: 30px; font-weight: 700; line-height: 1.1; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
  .badge.met { background: rgba(63,185,80,.15); color: var(--green); }
  .badge.breached { background: var(--red-dim); color: var(--red); }
  .kv { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .kv b { color: var(--text); font-weight: 600; }
  section.card { margin-top: 14px; }
  .bar-track { height: 16px; background: #21262d; border-radius: 4px; overflow: hidden;
               display: flex; margin: 8px 0 4px; }
  .bar-fill { background: var(--red); height: 100%; }
  .bar-rest { background: var(--green); height: 100%; }
  .alert { border: 1px solid var(--border); border-left: 4px solid var(--muted);
           border-radius: 6px; padding: 10px 12px; margin-top: 10px; }
  .alert.firing { border-left-color: var(--red); }
  .alert .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sev { font-size: 11px; font-weight: 700; text-transform: uppercase;
         padding: 2px 7px; border-radius: 4px; background: #21262d; }
  .sev.page { color: var(--red); } .sev.ticket { color: var(--orange); }
  .alert ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
  .alert ul b { color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  .up { color: var(--green); font-weight: 700; } .down { color: var(--red); font-weight: 700; }
  svg { width: 100%; height: auto; display: block; }
  .axis { stroke: var(--border); } .grid-line { stroke: #21262d; }
  .tick-label { fill: var(--muted); font-size: 11px; }
  .thresh-label { font-size: 11px; font-weight: 700; }
  footer { color: var(--muted); font-size: 12px; margin-top: 18px; }
  #error { display: none; background: var(--red-dim); border: 1px solid var(--red);
           color: var(--red); border-radius: 6px; padding: 10px 12px; margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">SRE Reliability Dashboard</h1>
    <span class="pill" id="status-pill">loading…</span>
    <span class="sub" id="window"></span>
  </header>

  <div id="error"></div>

  <div class="grid">
    <div class="card" id="card-availability"></div>
    <div class="card" id="card-latency"></div>
    <div class="card" id="card-capacity"></div>
  </div>

  <section class="card">
    <h2>Error budget — availability SLO</h2>
    <div id="budget"></div>
  </section>

  <section class="card">
    <h2>Burn rate — trailing 1h (log scale)</h2>
    <div id="chart"></div>
    <div class="kv" id="chart-note"></div>
  </section>

  <section class="card">
    <h2>Alerts at incident end</h2>
    <div id="alerts"></div>
  </section>

  <section class="card">
    <h2>Incident impact (post-incident review)</h2>
    <div id="incident"></div>
  </section>

  <section class="card">
    <h2>Health checks</h2>
    <div id="health"></div>
  </section>

  <footer id="footer"></footer>
</div>

<script>
"use strict";
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x, d=4) => (x * 100).toFixed(d) + "%";
const num = x => Math.round(x).toLocaleString("en-US");

function sloCard(el, title, slo, detail) {
  const badge = slo.met ? '<span class="badge met">MET</span>'
                        : '<span class="badge breached">BREACHED</span>';
  el.innerHTML = `<h2>${esc(title)}</h2>
    <div class="big">${pct(slo.attainment)} ${badge}</div>
    <div class="kv">${detail}</div>`;
}

function renderSummary(s) {
  document.getElementById("title").textContent =
    `SRE Reliability Dashboard — ${s.service}`;
  const pill = document.getElementById("status-pill");
  pill.textContent = s.status.label;
  pill.className = "pill " + s.status.level;
  document.getElementById("window").textContent =
    `data window ${s.data_start.slice(0,10)} → ${s.data_end.slice(0,10)} (${s.window_days} days)`;

  const av = s.slos.availability, la = s.slos.latency;
  sloCard(document.getElementById("card-availability"), "Availability SLO", av,
    `target <b>${pct(av.target, 1)}</b> · ${num(av.error_budget.requests)} requests · ` +
    `${num(av.error_budget.errors)} errors`);
  sloCard(document.getElementById("card-latency"), "Latency SLO", la,
    `target <b>${pct(la.target, 1)}</b> of requests within <b>${la.threshold_ms} ms</b>`);

  const cap = s.capacity;
  document.getElementById("card-capacity").innerHTML =
    `<h2>Capacity</h2><div class="big">${cap.avg_rps.toFixed(1)} rps</div>
     <div class="kv">average load vs <b>${cap.ceiling_rps.toFixed(0)} rps</b> ceiling · ` +
     `growth ${cap.growth_pct_per_day.toFixed(2)}%/day · days to ceiling: ` +
     `<b>${cap.days_to_ceiling === null ? "n/a (flat traffic)" : cap.days_to_ceiling.toFixed(0)}</b></div>`;

  const eb = av.error_budget;
  const consumedPct = eb.budget_events ? (eb.consumed_events / eb.budget_events * 100) : 0;
  const fill = Math.min(consumedPct, 100);
  document.getElementById("budget").innerHTML =
    `<div class="bar-track"><div class="bar-fill" style="width:${fill}%"></div>` +
    `<div class="bar-rest" style="width:${100 - fill}%"></div></div>
     <div class="kv">allowed <b>${num(eb.budget_events)}</b> error events · consumed ` +
    `<b>${num(eb.consumed_events)}</b> (${consumedPct.toFixed(1)}% of budget) · remaining ` +
    `<b>${num(eb.remaining_events)}</b> (<b>${eb.remaining_pct.toFixed(1)}%</b>)</div>`;

  document.getElementById("alerts").innerHTML = s.alerts.map(a => `
    <div class="alert ${a.fired ? "firing" : ""}">
      <div class="head"><b>${esc(a.rule)}</b>
        <span class="sev ${esc(a.severity)}">${esc(a.severity)}</span>
        <span class="badge ${a.fired ? "breached" : "met"}">${a.fired ? "FIRING" : "ok"}</span>
        <span class="kv">evaluated ${esc(a.evaluated_at)}</span></div>
      <ul>${a.conditions.map(c =>
        `<li>${c.fired ? "✓" : "·"} ${esc(c.reason)}</li>`).join("")}</ul>
    </div>`).join("");

  const inc = s.incident;
  document.getElementById("incident").innerHTML =
    `<div><b>${esc(inc.description)}</b></div>
     <div class="kv">window <b>${esc(inc.start)}</b> → <b>${esc(inc.end)}</b> · ` +
     `requests <b>${num(inc.requests)}</b> · errors <b>${num(inc.errors)}</b> ` +
     `(${(inc.error_ratio * 100).toFixed(2)}%) · consumed <b>${inc.budget_share_pct.toFixed(1)}%</b> ` +
     `of the error budget · detected by <b>${inc.detected_by.map(esc).join(", ") || "—"}</b></div>`;

  const h = s.health;
  if (h) {
    const rows = Object.values(h.endpoints).map(e => `
      <tr><td>${esc(e.path)}</td>
          <td class="${e.up ? "up" : "down"}">${e.up ? "UP" : "DOWN"}</td>
          <td>${(e.success_rate * 100).toFixed(0)}% (${e.successes}/${e.checks})</td>
          <td>${e.mean_latency_ms.toFixed(1)} ms</td>
          <td>${e.p95_latency_ms.toFixed(1)} ms</td></tr>`).join("");
    document.getElementById("health").innerHTML =
      `<table><tr><th>endpoint</th><th>state</th><th>success</th><th>mean</th><th>p95</th></tr>${rows}</table>
       <div class="kv">${esc(h.fixture)} · checked ${esc(h.checked_at)} · ${h.rounds} rounds</div>`;
  }

  document.getElementById("footer").textContent =
    `Sources: ${s.sources.join(", ")} · summary generated ${s.generated_at} · ` +
    `API: /api/summary, /api/series`;
}

function renderChart(series, incident) {
  const pts = series.points;
  if (!pts.length) { document.getElementById("chart").textContent = "no series data"; return; }
  const W = 920, H = 300, L = 58, R = 14, T = 16, B = 32;
  const iw = W - L - R, ih = H - T - B;
  const t0 = pts[0].ts, t1 = pts[pts.length - 1].ts;
  const minV = 0.1, maxV = Math.max(80, Math.max(...pts.map(p => p.burn_rate)) * 1.15);
  const lx = v => Math.log10(Math.max(v, minV));
  const X = ts => L + (ts - t0) / (t1 - t0) * iw;
  const Y = v => T + (lx(maxV) - lx(v)) / (lx(maxV) - lx(minV)) * ih;
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="burn rate chart">`;

  // incident shading
  const ix0 = X(Date.parse(incident.start) / 1000), ix1 = X(Date.parse(incident.end) / 1000);
  out += `<rect x="${ix0}" y="${T}" width="${Math.max(ix1 - ix0, 2)}" height="${ih}" fill="rgba(248,81,73,.10)"/>`;
  out += `<text class="tick-label" x="${ix0 + 4}" y="${T + 12}">incident</text>`;

  // gridlines + y labels
  for (const v of [0.1, 1, 10, 60]) {
    out += `<line class="grid-line" x1="${L}" y1="${Y(v)}" x2="${L + iw}" y2="${Y(v)}"/>`;
    out += `<text class="tick-label" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v}×</text>`;
  }
  // threshold lines
  for (const th of series.thresholds) {
    const color = th.value >= 14.4 ? "#f85149" : "#d29922";
    out += `<line x1="${L}" y1="${Y(th.value)}" x2="${L + iw}" y2="${Y(th.value)}" stroke="${color}" stroke-dasharray="6 4"/>`;
    out += `<text class="thresh-label" fill="${color}" x="${L + iw - 4}" y="${Y(th.value) - 5}" text-anchor="end">${th.value}× — ${esc(th.label)}</text>`;
  }
  // x day ticks
  const day = 86400, firstDay = Math.ceil(t0 / day) * day;
  for (let t = firstDay; t <= t1; t += day) {
    const d = new Date(t * 1000);
    const label = d.toLocaleDateString("en-US", {month: "short", day: "numeric", timeZone: "UTC"});
    out += `<line class="grid-line" x1="${X(t)}" y1="${T}" x2="${X(t)}" y2="${T + ih}"/>`;
    out += `<text class="tick-label" x="${X(t)}" y="${H - 10}" text-anchor="middle">${label}</text>`;
  }
  // axes
  out += `<line class="axis" x1="${L}" y1="${T}" x2="${L}" y2="${T + ih}"/>`;
  out += `<line class="axis" x1="${L}" y1="${T + ih}" x2="${L + iw}" y2="${T + ih}"/>`;
  // the line itself
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(p.ts).toFixed(1)},${Y(p.burn_rate).toFixed(1)}`).join(" ");
  out += `<path d="${d}" fill="none" stroke="#58a6ff" stroke-width="1.6"/>`;
  out += "</svg>";
  document.getElementById("chart").innerHTML = out;

  const peak = pts.reduce((a, b) => (b.burn_rate > a.burn_rate ? b : a), pts[0]);
  document.getElementById("chart-note").innerHTML =
    `trailing-1h burn rate sampled every ${series.step_seconds / 60} min · peak ` +
    `<b>${peak.burn_rate.toFixed(2)}×</b> at ${esc(peak.iso)} · shaded band = incident window · ` +
    `dashed lines = alert thresholds`;
}

Promise.all([
  fetch("/api/summary").then(r => { if (!r.ok) throw new Error("/api/summary " + r.status); return r.json(); }),
  fetch("/api/series").then(r => { if (!r.ok) throw new Error("/api/series " + r.status); return r.json(); }),
]).then(([summary, series]) => {
  renderSummary(summary);
  renderChart(series, summary.incident);
}).catch(err => {
  const e = document.getElementById("error");
  e.style.display = "block";
  e.textContent = "Could not load dashboard data: " + err.message +
    " — run the pipeline, then: python -m dashboard.build_data";
});
</script>
</body>
</html>
